<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">LuxeStay - Hệ thống đặt phòng khách sạn</title>
    
    <!-- Google Fonts: Inter, Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- LuxeStay Design System -->
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- API Client -->
    <script src="/js/api.js"></script>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar">Navbar</div>
    
    <div class="ls-page-wrapper">
        <div th:if="${successMessage}" class="ls-alert ls-alert--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="ls-alert ls-alert--danger" th:text="${errorMessage}"></div>
        <th:block th:replace="~{__${view}__}"></th:block>
    </div>
    
    <div id="ls-toast-container" class="ls-toast-container"></div>
    
    <th:block th:if="${extraScript}">
        <th:block th:replace="~{__${extraScript}__}"></th:block>
    </th:block>
</body>
</html>
