<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head></head>
<body>
    <th:block th:fragment="content">
        <script>
            async function handleLogin(event) {
                event.preventDefault();
                const errorDiv = document.getElementById('login-error');
                errorDiv.style.display = 'none';
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                try {
                    const data = await AuthAPI.login(username, password);
                    
                    // Decode JWT to get user info
                    const payload = JSON.parse(atob(data.accessToken.split('.')[1]));
                    const auth = payload.authorities && payload.authorities[0];
                    const role = payload.role || (typeof auth === 'string' ? auth.replace('ROLE_', '') : auth?.authority?.replace('ROLE_', ''));
                    const phoneVerified = payload.phoneVerified;
                    
                    TokenManager.saveUser({
                        username: payload.sub,
                        role: role || 'CUSTOMER'
                    });
                    
                    // If phone not verified, redirect to verification page
                    if (!phoneVerified) {
                        window.location.href = '/verify-phone';
                        return false;
                    }
                    
                    // Redirect based on role
                    if (role === 'MANAGER') {
                        window.location.href = '/admin/dashboard';
                    } else {
                        window.location.href = '/';
                    }
                } catch (error) {
                    const msg = error.data?.message || error.message || 'Invalid username or password';
                    errorDiv.textContent = msg;
                    errorDiv.style.display = 'block';
                }
                return false;
            }

            // Auto-redirect if already logged in
            (function() {
                if (!TokenManager.isAuthenticated()) return;
                
                const token = TokenManager.getAccessToken();
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    
                    // Check token expiry
                    if (payload.exp && payload.exp * 1000 < Date.now()) {
                        TokenManager.clearTokens();
                        return;
                    }
                    
                    const auth = payload.authorities && payload.authorities[0];
                    const role = payload.role || (typeof auth === 'string' ? auth.replace('ROLE_', '') : auth?.authority?.replace('ROLE_', ''));
                    const phoneVerified = payload.phoneVerified;
                    
                    TokenManager.saveUser({
                        username: payload.sub,
                        role: role || 'CUSTOMER'
                    });
                    
                    if (!phoneVerified) {
                        window.location.href = '/verify-phone';
                    } else if (role === 'MANAGER') {
                        window.location.href = '/admin/dashboard';
                    } else {
                        window.location.href = '/';
                    }
                } catch {
                    // Invalid token, clear and show login page
                    TokenManager.clearTokens();
                }
            })();
        </script>
    </th:block>
</body>
</html>
