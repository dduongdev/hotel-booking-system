<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="ls-container">
            <div class="ls-page-header" style="margin-bottom:32px;">
                <h1>Đặt chỗ của tôi</h1>
                <p>Xem và quản lý các lượt đặt phòng của bạn tại LuxeStay.</p>
            </div>
            
            <!-- Bookings Table -->
            <div class="ls-card">
                <div class="ls-card__header">
                    <h3>Danh sách đặt phòng</h3>
                    <div style="position:relative;">
                        <span class="ls-icon ls-icon--sm" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--slate-400);">search</span>
                        <input type="text" id="search-bookings" class="ls-form-input" placeholder="Tìm kiếm mã đặt chỗ..." style="padding-left:36px;padding-top:8px;padding-bottom:8px;min-width:200px;" oninput="filterMyBookings(this.value)">
                    </div>
                </div>
                
                <div id="my-bookings-container">
                    <div class="ls-loading">
                        <div class="ls-spinner"></div>
                        <p>Đang tải dữ liệu đặt phòng...</p>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
