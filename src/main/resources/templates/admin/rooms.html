<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head></body>
<body>
    <th:block th:fragment="content">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Manage Rooms</h1>
                <p>Add, edit, and manage hotel rooms.</p>
            </div>
            <button onclick="showAddRoomModal()" class="btn btn-primary">+ Add Room</button>
        </div>

        <div id="admin-rooms-container">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading rooms...</p>
            </div>
        </div>

        <!-- Add/Edit Room Modal -->
        <div id="room-modal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="room-modal-title">Add Room</h3>
                    <button class="close-btn" onclick="closeRoomModal()">&times;</button>
                </div>
                <form id="room-form" onsubmit="return saveRoom(event)">
                    <div class="modal-body">
                        <div id="room-form-error" class="alert alert-danger" style="display: none;"></div>
                        <input type="hidden" id="room-id">
                        <div class="form-group">
                            <label class="form-label" for="room-name">Room Name</label>
                            <input type="text" id="room-name" class="form-control" placeholder="e.g. Room 101" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="room-type-select">Room Type</label>
                            <select id="room-type-select" class="form-control" required>
                                <option value="">-- Select Room Type --</option>
                            </select>
                        </div>
                        <div class="form-group" id="room-hidden-group" style="display: none;">
                            <label class="form-label">
                                <input type="checkbox" id="room-hidden"> Hidden
                            </label>
                            <small style="color: var(--gray-500); display: block; margin-top: 4px;">Hidden rooms won't be shown to customers.</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" onclick="closeRoomModal()" class="btn btn-outline">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
