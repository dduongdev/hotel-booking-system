<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);

                document.getElementById('check-in').value = today.toISOString().split('T')[0];
                document.getElementById('check-out').value = tomorrow.toISOString().split('T')[0];

                searchAvailability();
            });

            async function searchAvailability() {
                const checkIn = document.getElementById('check-in').value;
                const checkOut = document.getElementById('check-out').value;
                const grid = document.getElementById('room-types-grid');

                if (!checkIn || !checkOut) {
                    ToastManager.show('Vui lòng chọn ngày nhận và trả phòng.', 'warning');
                    return;
                }

                if (checkIn >= checkOut) {
                    ToastManager.show('Ngày trả phòng phải sau ngày nhận phòng.', 'warning');
                    return;
                }

                grid.innerHTML = '<div class="ls-loading" style="grid-column:1/-1;"><div class="ls-spinner"></div><p>Đang tải phòng trống...</p></div>';

                try {
                    const results = await RoomTypeAPI.getAvailability(checkIn, checkOut);

                    if (!results || results.length === 0) {
                        grid.innerHTML = '<div class="ls-empty" style="grid-column:1/-1;"><div class="ls-empty__title">Không có phòng trống</div><p class="ls-empty__text">Không có phòng trống cho ngày đã chọn. Vui lòng chọn ngày khác.</p></div>';
                        return;
                    }

                    const isAuth = TokenManager.isAuthenticated();

                    grid.innerHTML = results.map(rt => {
                        const roomImg = rt.imageUrl || `https://images.unsplash.com/photo-${Math.random() > 0.5 ? '1590490360182-c33d57733427' : '1611892472016-f2e38b7de8e9'}?w=800&q=80`;
                        return `
                        <div class="ls-card" style="display:flex;flex-direction:column;">
                            <div style="height:200px;background-image:url('${roomImg}');background-size:cover;background-position:center;border-radius:var(--radius-lg) var(--radius-lg) 0 0;"></div>
                            <div class="ls-card__body" style="flex:1;display:flex;flex-direction:column;">
                                <h3 style="font-family:var(--font-display);font-weight:700;font-size:1.125rem;color:var(--slate-900);margin-bottom:8px;">${escapeHtml(rt.name)}</h3>
                                <p style="color:var(--slate-500);font-size:0.875rem;margin-bottom:16px;flex:1;">${escapeHtml(rt.description || 'Không có mô tả.')}</p>
                                <div class="flex gap-4 flex-wrap" style="margin-bottom:16px;">
                                    <span class="flex items-center gap-1.5 text-sm" style="color:var(--slate-700);">
                                        <span class="ls-icon ls-icon--sm">people</span> ${rt.capacity} khách
                                    </span>
                                    <span class="flex items-center gap-1.5 text-sm" style="color:var(--slate-700);">
                                        <span class="ls-icon ls-icon--sm">bed</span> ${rt.availableRoomCount} phòng trống
                                    </span>
                                </div>
                                <div class="flex items-end justify-between" style="margin-top:auto;">
                                    <div>
                                        <span class="text-xs" style="color:var(--slate-400);">Giá chỉ từ</span>
                                        <div class="text-xl font-bold font-display" style="color:var(--color-secondary);">${formatCurrency(rt.pricePerNight)} <span style="font-size:0.75rem;font-weight:400;color:var(--slate-400);font-family:var(--font-sans);">/ đêm</span></div>
                                    </div>
                                    ${isAuth 
                                        ? `<button onclick="bookNow(${rt.id}, '${checkIn}', '${checkOut}', this)" class="ls-btn ls-btn--secondary ls-btn--sm">Đặt ngay</button>`
                                        : `<a href="/login" class="ls-btn ls-btn--outline ls-btn--sm">Đăng nhập để đặt</a>`
                                    }
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('');
                } catch (error) {
                    grid.innerHTML = '<div class="ls-empty" style="grid-column:1/-1;"><div class="ls-empty__icon">⚠️</div><div class="ls-empty__title">Lỗi tải dữ liệu</div><p class="ls-empty__text">' + escapeHtml(error.message) + '</p></div>';
                }
            }

            async function bookNow(roomTypeId, checkIn, checkOut, btn) {
                if (btn) { btn.disabled = true; btn.innerHTML = '<span class="ls-spinner ls-spinner--sm" style="display:inline-block;margin:0 auto;"></span> Đang đặt...'; }
                try {
                    const result = await BookingAPI.make({
                        roomTypeId: roomTypeId,
                        checkIn: checkIn,
                        checkOut: checkOut
                    });
                    ToastManager.show('Đặt phòng thành công! Mã #' + result.id, 'success');
                    setTimeout(() => { window.location.href = '/bookings/my'; }, 1500);
                } catch (error) {
                    ToastManager.show(error.message || 'Đặt phòng thất bại.', 'error');
                    if (btn) { btn.disabled = false; btn.textContent = 'Đặt ngay'; }
                }
            }
        </script>
    </th:block>
</body>
</html>
