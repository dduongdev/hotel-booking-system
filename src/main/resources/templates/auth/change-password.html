<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="ls-auth-page">
            <div class="ls-auth-bg-blob">
                <div class="ls-auth-bg-blob-1"></div>
                <div class="ls-auth-bg-blob-2"></div>
            </div>
            
            <button onclick="window.location.href='/'" class="absolute" style="top:24px;left:24px;color:var(--slate-500);background:none;border:none;display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:700;cursor:pointer;z-index:10;">
                <span class="ls-icon ls-icon--sm">arrow_back</span> Quay lại Trang chủ
            </button>
            
            <div class="ls-auth-card">
                <div class="ls-auth-card__brand">
                    <div class="ls-auth-card__brand-name">LuxeStay</div>
                    <p class="ls-auth-card__brand-sub">Đổi mật khẩu tài khoản của bạn</p>
                </div>
                
                <div id="change-password-error" class="ls-alert ls-alert--danger" style="display:none;"></div>
                <div id="change-password-success" class="ls-alert ls-alert--success" style="display:none;"></div>
                
                <form id="change-password-form" onsubmit="return handleChangePassword(event)">
                    <div class="ls-form-group">
                        <label class="ls-form-label" for="current-password">Mật khẩu hiện tại</label>
                        <div style="position:relative;">
                            <input type="password" id="current-password" class="ls-form-input" placeholder="Nhập mật khẩu hiện tại" required>
                            <button type="button" onclick="togglePassword('current-password', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--slate-400);cursor:pointer;">
                                <span class="ls-icon ls-icon--sm">visibility</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="ls-form-group">
                        <label class="ls-form-label" for="new-password">Mật khẩu mới</label>
                        <div style="position:relative;">
                            <input type="password" id="new-password" class="ls-form-input" placeholder="Nhập mật khẩu mới (8+ ký tự)" required minlength="8" oninput="checkPasswordStrength(this.value)">
                            <button type="button" onclick="togglePassword('new-password', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--slate-400);cursor:pointer;">
                                <span class="ls-icon ls-icon--sm">visibility</span>
                            </button>
                        </div>
                        <div class="ls-password-strength" id="cp-pw-strength" style="display:none;">
                            <div class="ls-password-strength__bar" id="cp-bar-1" style="background:var(--slate-100);"></div>
                            <div class="ls-password-strength__bar" id="cp-bar-2" style="background:var(--slate-100);"></div>
                            <div class="ls-password-strength__bar" id="cp-bar-3" style="background:var(--slate-100);"></div>
                            <div class="ls-password-strength__bar" id="cp-bar-4" style="background:var(--slate-100);"></div>
                        </div>
                    </div>
                    
                    <div class="ls-form-group">
                        <label class="ls-form-label" for="confirm-new-password">Xác nhận mật khẩu mới</label>
                        <div style="position:relative;">
                            <input type="password" id="confirm-new-password" class="ls-form-input" placeholder="Xác nhận mật khẩu mới" required oninput="checkPasswordMatch()">
                            <button type="button" onclick="togglePassword('confirm-new-password', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--slate-400);cursor:pointer;">
                                <span class="ls-icon ls-icon--sm">visibility</span>
                            </button>
                        </div>
                        <p id="cp-match-error" style="color:var(--danger);font-size:0.75rem;margin-top:4px;display:none;">Mật khẩu xác nhận không khớp</p>
                    </div>
                    
                    <button type="submit" class="ls-btn ls-btn--primary" style="width:100%;margin-top:8px;" id="btn-change-password">
                        <span class="ls-icon ls-icon--sm">lock</span> Đổi mật khẩu
                    </button>
                </form>
                
                <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--slate-100);font-size:0.875rem;color:var(--slate-500);">
                    <a href="/" style="font-weight:700;">← Về trang chủ</a>
                </div>
            </div>
            
            <div class="ls-auth-card__decorative">
                <div style="width:100%;height:100%;background-size:cover;background-position:center;background-image:url('https://images.unsplash.com/photo-1582719508461-905c673771fd?w=400&q=80');"></div>
            </div>
        </div>
        
        <script>
            if (!TokenManager.isAuthenticated()) {
                window.location.href = '/login';
            }
            
            function togglePassword(inputId, btn) {
                const input = document.getElementById(inputId);
                const icon = btn.querySelector('.ls-icon');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            }
            
            function checkPasswordStrength(password) {
                const container = document.getElementById('cp-pw-strength');
                if (password.length === 0) {
                    container.style.display = 'none';
                    return;
                }
                container.style.display = 'flex';
                
                const bars = ['cp-bar-1', 'cp-bar-2', 'cp-bar-3', 'cp-bar-4'];
                let score = 0;
                if (password.length >= 8) score++;
                if (password.length >= 12) score++;
                if (/[A-Z]/.test(password)) score++;
                if (/[0-9]/.test(password)) score++;
                if (/[^A-Za-z0-9]/.test(password)) score++;
                
                const colors = ['', 'var(--danger)', '#f59e0b', '#facc15', '#22c55e', '#22c55e'];
                const level = Math.min(score, 4);
                bars.forEach((bar, i) => {
                    const el = document.getElementById(bar);
                    el.style.background = i < level ? colors[level] : 'var(--slate-100)';
                });
            }
            
            function checkPasswordMatch() {
                const newPw = document.getElementById('new-password').value;
                const confirmPw = document.getElementById('confirm-new-password').value;
                const errorEl = document.getElementById('cp-match-error');
                if (confirmPw.length > 0 && newPw !== confirmPw) {
                    errorEl.style.display = 'block';
                } else {
                    errorEl.style.display = 'none';
                }
            }
            
            async function handleChangePassword(event) {
                event.preventDefault();
                const errorDiv = document.getElementById('change-password-error');
                const successDiv = document.getElementById('change-password-success');
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                
                const currentPassword = document.getElementById('current-password').value;
                const newPassword = document.getElementById('new-password').value;
                const confirmNewPassword = document.getElementById('confirm-new-password').value;
                
                if (newPassword !== confirmNewPassword) {
                    errorDiv.textContent = 'Mật khẩu mới không khớp!';
                    errorDiv.style.display = 'block';
                    return false;
                }
                
                if (newPassword.length < 8) {
                    errorDiv.textContent = 'Mật khẩu mới phải có ít nhất 8 ký tự!';
                    errorDiv.style.display = 'block';
                    return false;
                }
                
                try {
                    const btn = document.getElementById('btn-change-password');
                    btn.disabled = true;
                    btn.innerHTML = '<span class="ls-spinner ls-spinner--sm" style="display:inline-block;"></span> Đang đổi...';
                    
                    const data = await AuthAPI.changePassword(currentPassword, newPassword, confirmNewPassword);
                    
                    TokenManager.setTokens(data.accessToken, data.refreshToken);
                    
                    const payload = decodeJwt(data.accessToken);
                    if (payload) {
                        const role = extractRoleFromPayload(payload);
                        TokenManager.saveUser({
                            username: payload.sub || 'User',
                            role: role
                        });
                    }
                    
                    successDiv.textContent = 'Đổi mật khẩu thành công! Đang chuyển trang...';
                    successDiv.style.display = 'block';
                    
                    document.getElementById('change-password-form').reset();
                    document.getElementById('cp-pw-strength').style.display = 'none';
                    
                    if (typeof ToastManager !== 'undefined') {
                        ToastManager.show('Đổi mật khẩu thành công!', 'success');
                    }
                    
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } catch (error) {
                    const msg = error.data?.message || error.message || 'Đổi mật khẩu thất bại.';
                    errorDiv.textContent = msg;
                    errorDiv.style.display = 'block';
                    const btn = document.getElementById('btn-change-password');
                    btn.disabled = false;
                    btn.innerHTML = '<span class="ls-icon ls-icon--sm">lock</span> Đổi mật khẩu';
                }
                return false;
            }
        </script>
    </th:block>
</body>
</html>
