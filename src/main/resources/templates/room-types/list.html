<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="ls-container">
            <div class="page-header" style="margin-bottom:32px;">
                <h1 style="font-family:var(--font-display);font-size:1.75rem;font-weight:800;color:var(--slate-900);">Khám phá Phòng</h1>
                <p style="color:var(--slate-500);font-size:0.9375rem;">Tìm phòng hoàn hảo cho kỳ nghỉ của bạn. Nhập ngày để kiểm tra tình trạng phòng.</p>
            </div>
            
            <!-- Branch Selector + Search Bar -->
            <div class="ls-filter-bar" style="flex-wrap:wrap;">
                <div class="ls-form-group" style="flex:1;min-width:200px;margin-bottom:0;">
                    <label class="ls-form-label" for="room-list-branch-select">Chi nhánh</label>
                    <select id="room-list-branch-select" class="ls-form-input" onchange="onBranchChange()">
                        <option value="">-- Chọn chi nhánh --</option>
                    </select>
                </div>
                <div class="ls-form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                    <label class="ls-form-label" for="check-in">Ngày nhận phòng</label>
                    <input type="date" id="check-in" class="ls-form-input">
                </div>
                <div class="ls-form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                    <label class="ls-form-label" for="check-out">Ngày trả phòng</label>
                    <input type="date" id="check-out" class="ls-form-input">
                </div>
                <button onclick="searchAvailability()" class="ls-btn ls-btn--secondary" style="flex-shrink:0;margin-top:20px;">
                    <span class="ls-icon ls-icon--sm">search</span>
                    Tìm kiếm
                </button>
            </div>
            
            <!-- Room Type Cards Grid -->
            <div id="room-types-grid" class="grid" style="grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));gap:24px;">
                <div class="ls-loading" style="grid-column:1/-1;">
                    <div class="ls-spinner"></div>
                    <p>Đang tải danh sách phòng...</p>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
