<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            let currentPage = 0;
            const pageSize = 12;

            let roomsBranchId = null;

            document.addEventListener('DOMContentLoaded', async () => {
                // Load first branch for room listing
                try {
                    const branchResult = await BranchAPI.getAll(0, 1);
                    const branches = branchResult.content || [];
                    if (branches.length > 0) {
                        roomsBranchId = branches[0].id;
                    }
                } catch (e) {
                    console.error('Failed to load branches', e);
                }
                if (roomsBranchId) {
                    loadRooms();
                }
            });

            async function loadRooms(page = 0) {
                if (!roomsBranchId) {
                    document.getElementById('rooms-container').innerHTML = '<div class="ls-empty"><div class="ls-empty__title">Chưa có dữ liệu</div><p class="ls-empty__text">Chưa có chi nhánh nào.</p></div>';
                    return;
                }
                currentPage = page;
                const container = document.getElementById('rooms-container');
                container.innerHTML = '<div class="ls-loading"><div class="ls-spinner"></div><p>Đang tải danh sách phòng...</p></div>';
                
                try {
                    const result = await RoomAPI.getAll(roomsBranchId, page, pageSize);
                    const rooms = result.content || [];
                    const totalPages = result.totalPages || 0;
                    
                    if (rooms.length === 0) {
                        container.innerHTML = '<div class="ls-empty"><div class="ls-empty__icon">🛏️</div><div class="ls-empty__title">Không có phòng</div><p class="ls-empty__text">Hiện không có phòng nào.</p></div>';
                        return;
                    }
                    
                    let html = '<div class="ls-table-container"><table class="ls-table"><thead><tr><th>ID</th><th>Tên phòng</th><th>Loại phòng</th><th>Giá/Đêm</th><th>Sức chứa</th><th>Trạng thái</th></tr></thead><tbody>';
                    
                    rooms.forEach(room => {
                        const statusBadge = room.hidden ? '<span class="ls-badge ls-badge--hidden">Ẩn</span>' : '<span class="ls-badge ls-badge--visible">Hoạt động</span>';
                        html += `<tr>
                            <td>${room.id}</td>
                            <td><strong>${escapeHtml(room.name)}</strong></td>
                            <td>${escapeHtml(room.roomType?.name || 'N/A')}</td>
                            <td>${formatCurrency(room.roomType?.pricePerNight || 0)}</td>
                            <td>${room.roomType?.capacity || 0} khách</td>
                            <td>${statusBadge}</td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table></div>';
                    
                    if (totalPages > 1) {
                        html += '<div class="ls-pagination">';
                        html += `<button onclick="loadRooms(0)" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#171;</button>`;
                        html += `<button onclick="loadRooms(${page - 1})" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#8249;</button>`;
                        html += `<span class="ls-pagination__info">Trang ${page + 1} / ${totalPages}</span>`;
                        html += `<button onclick="loadRooms(${page + 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#8250;</button>`;
                        html += `<button onclick="loadRooms(${totalPages - 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#187;</button>`;
                        html += '</div>';
                    }
                    
                    container.innerHTML = html;
                } catch (error) {
                    container.innerHTML = '<div class="ls-empty"><div class="ls-empty__title">Lỗi tải dữ liệu</div><p class="ls-empty__text">' + escapeHtml(error.message) + '</p></div>';
                }
            }
        </script>
    </th:block>
</body>
</html>
