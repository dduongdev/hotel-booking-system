<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head></head>
<body>
    <th:block th:fragment="content">
        <script>
            // Auto-redirect if not authenticated
            if (!TokenManager.isAuthenticated()) {
                window.location.href = '/login';
            }

            document.addEventListener('DOMContentLoaded', function() {
                // Password visibility toggle
                window.togglePasswordVisibility = function(inputId, btn) {
                    const input = document.getElementById(inputId);
                    const icon = btn.querySelector('i');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.className = 'bi bi-eye-slash';
                    } else {
                        input.type = 'password';
                        icon.className = 'bi bi-eye';
                    }
                };

                // Password strength checker
                const newPasswordInput = document.getElementById('new-password');
                const confirmPasswordInput = document.getElementById('confirm-new-password');
                const strengthFill = document.getElementById('password-strength-fill');
                const strengthText = document.getElementById('password-strength-text');
                const ruleLength = document.getElementById('rule-length');
                const ruleMatch = document.getElementById('rule-match');
                const matchError = document.getElementById('password-match-error');
                const submitBtn = document.getElementById('btn-change-password');

                function checkPasswordStrength(password) {
                    let score = 0;
                    if (password.length >= 8) score++;
                    if (password.length >= 12) score++;
                    if (/[A-Z]/.test(password)) score++;
                    if (/[a-z]/.test(password)) score++;
                    if (/[0-9]/.test(password)) score++;
                    if (/[^A-Za-z0-9]/.test(password)) score++;

                    const levels = [
                        { min: 0, label: 'Weak', color: '#ea4335', width: '20%' },
                        { min: 2, label: 'Fair', color: '#fbbc04', width: '40%' },
                        { min: 3, label: 'Good', color: '#4285f4', width: '60%' },
                        { min: 5, label: 'Strong', color: '#34a853', width: '80%' },
                        { min: 6, label: 'Very Strong', color: '#34a853', width: '100%' }
                    ];

                    let level = levels[0];
                    for (const l of levels) {
                        if (score >= l.min) level = l;
                    }

                    strengthFill.style.width = level.width;
                    strengthFill.style.background = level.color;
                    strengthText.textContent = level.label;
                    strengthText.style.color = level.color;
                }

                function updateRules() {
                    const password = newPasswordInput.value;
                    const confirm = confirmPasswordInput.value;

                    // Length rule
                    if (password.length >= 8) {
                        ruleLength.querySelector('i').className = 'bi bi-check-circle-fill';
                        ruleLength.querySelector('i').style.color = '#34a853';
                        ruleLength.style.color = '#34a853';
                    } else {
                        ruleLength.querySelector('i').className = 'bi bi-circle';
                        ruleLength.querySelector('i').style.color = '';
                        ruleLength.style.color = '';
                    }

                    // Match rule
                    if (password.length > 0 && confirm.length > 0 && password === confirm) {
                        ruleMatch.querySelector('i').className = 'bi bi-check-circle-fill';
                        ruleMatch.querySelector('i').style.color = '#34a853';
                        ruleMatch.style.color = '#34a853';
                        matchError.style.display = 'none';
                    } else if (confirm.length > 0 && password !== confirm) {
                        ruleMatch.querySelector('i').className = 'bi bi-circle';
                        ruleMatch.querySelector('i').style.color = '';
                        ruleMatch.style.color = '';
                        matchError.style.display = 'block';
                    } else {
                        ruleMatch.querySelector('i').className = 'bi bi-circle';
                        ruleMatch.querySelector('i').style.color = '';
                        ruleMatch.style.color = '';
                        matchError.style.display = 'none';
                    }

                    // Enable/disable submit
                    const valid = password.length >= 8 && password === confirm;
                    submitBtn.disabled = !valid;
                }

                newPasswordInput.addEventListener('input', function() {
                    checkPasswordStrength(this.value);
                    updateRules();
                });

                confirmPasswordInput.addEventListener('input', updateRules);

                // Form submit
                window.handleChangePassword = async function(event) {
                    event.preventDefault();
                    const errorDiv = document.getElementById('change-password-error');
                    const successDiv = document.getElementById('change-password-success');
                    errorDiv.style.display = 'none';
                    successDiv.style.display = 'none';

                    const currentPassword = document.getElementById('current-password').value;
                    const newPassword = document.getElementById('new-password').value;
                    const confirmNewPassword = document.getElementById('confirm-new-password').value;

                    if (newPassword !== confirmNewPassword) {
                        errorDiv.textContent = 'New passwords do not match!';
                        errorDiv.style.display = 'block';
                        return false;
                    }

                    if (newPassword.length < 8) {
                        errorDiv.textContent = 'New password must be at least 8 characters!';
                        errorDiv.style.display = 'block';
                        return false;
                    }

                    try {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span class="loading-spinner-small"></span> Changing...';

                        const data = await AuthAPI.changePassword(currentPassword, newPassword, confirmNewPassword);

                        // Update tokens with the new ones returned from the server
                        TokenManager.setTokens(data.accessToken, data.refreshToken);

                        successDiv.textContent = 'Password changed successfully!';
                        successDiv.style.display = 'block';

                        // Reset form
                        document.getElementById('change-password-form').reset();
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Change Password';

                        // Reset strength indicator
                        document.getElementById('password-strength-fill').style.width = '0%';
                        document.getElementById('password-strength-text').textContent = '';

                        showToast('Password changed successfully!', 'success');

                        // Redirect to home after 2 seconds
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    } catch (error) {
                        const msg = error.data?.message || error.message || 'Failed to change password. Please try again.';
                        errorDiv.textContent = msg;
                        errorDiv.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Change Password';
                    }
                    return false;
                };
            });
        </script>
    </th:block>
</body>
</html>
