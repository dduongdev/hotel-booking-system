<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            let adminRoomsPage = 0;
            const adminRoomsPageSize = 15;

            document.addEventListener('DOMContentLoaded', () => {
                if (!TokenManager.isAuthenticated()) {
                    window.location.href = '/login';
                    return;
                }
                const user = TokenManager.getUser();
                if (!user || user.role !== 'MANAGER') {
                    window.location.href = '/';
                    return;
                }
                loadAdminRooms();
            });

            async function loadAdminRooms(page = 0) {
                adminRoomsPage = page;
                const container = document.getElementById('admin-rooms-container');
                container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading rooms...</p></div>';
                
                try {
                    const result = await RoomAPI.getAll(page, adminRoomsPageSize);
                    const rooms = result.content || [];
                    const totalPages = result.totalPages || 0;
                    const roomTypes = (await RoomTypeAPI.getAll()).content;
                    
                    if (rooms.length === 0) {
                        container.innerHTML = '<div class="empty-state"><div class="icon">&#128716;</div><h3>No Rooms Found</h3><p>No rooms have been created yet.</p></div>';
                        return;
                    }
                    
                    let html = '<div class="card"><div class="table-container"><table><thead><tr><th>ID</th><th>Name</th><th>Room Type</th><th>Price/Night</th><th>Capacity</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
                    
                    rooms.forEach(room => {
                        const statusBadge = room.hidden ? '<span class="badge badge-danger">Hidden</span>' : '<span class="badge badge-success">Active</span>';
                        html += `<tr>
                            <td><strong>${room.id}</strong></td>
                            <td>${escapeHtml(room.name)}</td>
                            <td>${escapeHtml(room.roomType?.name || 'N/A')}</td>
                            <td>${formatCurrency(room.roomType?.pricePerNight || 0)}</td>
                            <td>${room.roomType?.capacity || 0} guests</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button class="btn btn-outline btn-sm edit-room-btn" 
                                    data-id="${room.id}" 
                                    data-name="${room.name.replace(/'/g, '&#39;')}" 
                                    data-type="${room.roomType?.id || 0}" 
                                    data-hidden="${room.hidden}">Edit</button>
                            </td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table></div></div>';
                    
                    if (totalPages > 1) {
                        html += '<div class="pagination">';
                        html += `<button onclick="loadAdminRooms(0)" ${page === 0 ? 'disabled' : ''}>&#171; First</button>`;
                        html += `<button onclick="loadAdminRooms(${page - 1})" ${page === 0 ? 'disabled' : ''}>&#8249; Prev</button>`;
                        html += `<span class="page-info">Page ${page + 1} of ${totalPages}</span>`;
                        html += `<button onclick="loadAdminRooms(${page + 1})" ${page >= totalPages - 1 ? 'disabled' : ''}>Next &#8250;</button>`;
                        html += `<button onclick="loadAdminRooms(${totalPages - 1})" ${page >= totalPages - 1 ? 'disabled' : ''}>Last &#187;</button>`;
                        html += '</div>';
                    }
                    
                    container.innerHTML = html;
                    
                    // Attach click handlers for edit buttons
                    container.querySelectorAll('.edit-room-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = parseInt(btn.dataset.id);
                            const name = btn.dataset.name;
                            const typeId = parseInt(btn.dataset.type);
                            const hidden = btn.dataset.hidden === 'true';
                            editRoom(id, name, typeId, hidden);
                        });
                    });
                } catch (error) {
                    container.innerHTML = '<div class="empty-state"><div class="icon">&#9888;</div><h3>Error Loading Rooms</h3><p>' + escapeHtml(error.message) + '</p></div>';
                }
            }

            async function populateRoomTypeSelect(selectedId) {
                try {
                    const roomTypes = (await RoomTypeAPI.getAll()).content;
                    const select = document.getElementById('room-type-select');
                    select.innerHTML = '<option value="">-- Select Room Type --</option>';
                    roomTypes.forEach(rt => {
                        const option = document.createElement('option');
                        option.value = rt.id;
                        option.textContent = `${rt.name} - ${formatCurrency(rt.pricePerNight)}/night`;
                        if (rt.id === selectedId) option.selected = true;
                        select.appendChild(option);
                    });
                } catch (error) {
                    showToast('Failed to load room types.', 'error');
                }
            }

            async function showAddRoomModal() {
                document.getElementById('room-modal-title').textContent = 'Add Room';
                document.getElementById('room-id').value = '';
                document.getElementById('room-name').value = '';
                document.getElementById('room-hidden').checked = false;
                document.getElementById('room-hidden-group').style.display = 'none';
                document.getElementById('room-form-error').style.display = 'none';
                await populateRoomTypeSelect(null);
                document.getElementById('room-modal').classList.add('active');
            }

            async function editRoom(id, name, roomTypeId, hidden) {
                document.getElementById('room-modal-title').textContent = 'Edit Room';
                document.getElementById('room-id').value = id;
                document.getElementById('room-name').value = name;
                document.getElementById('room-hidden').checked = hidden;
                document.getElementById('room-hidden-group').style.display = 'block';
                document.getElementById('room-form-error').style.display = 'none';
                await populateRoomTypeSelect(roomTypeId);
                document.getElementById('room-modal').classList.add('active');
            }

            function closeRoomModal() {
                document.getElementById('room-modal').classList.remove('active');
            }

            async function saveRoom(event) {
                event.preventDefault();
                const errorDiv = document.getElementById('room-form-error');
                errorDiv.style.display = 'none';
                
                const id = document.getElementById('room-id').value;
                const name = document.getElementById('room-name').value;
                const roomTypeId = parseInt(document.getElementById('room-type-select').value);
                const hidden = document.getElementById('room-hidden').checked;
                
                if (!name || !roomTypeId) {
                    errorDiv.textContent = 'Please fill in all required fields.';
                    errorDiv.style.display = 'block';
                    return false;
                }
                
                try {
                    if (id) {
                        await RoomAPI.update(parseInt(id), { name, roomTypeId, hidden });
                        showToast('Room updated successfully.', 'success');
                    } else {
                        await RoomAPI.create({ name, roomTypeId });
                        showToast('Room created successfully.', 'success');
                    }
                    closeRoomModal();
                    loadAdminRooms(adminRoomsPage);
                } catch (error) {
                    errorDiv.textContent = error.message || 'Operation failed.';
                    errorDiv.style.display = 'block';
                }
                return false;
            }
        </script>
    </th:block>
</body>
</html>
