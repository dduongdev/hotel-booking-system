<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="ls-auth-page">
            <div class="ls-auth-bg-blob">
                <div class="ls-auth-bg-blob-1"></div>
                <div class="ls-auth-bg-blob-2"></div>
            </div>
            
            <button onclick="window.location.href='/'" class="absolute" style="top:24px;left:24px;color:var(--slate-500);background:none;border:none;display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:700;cursor:pointer;z-index:10;">
                <span class="ls-icon ls-icon--sm">arrow_back</span> Quay lại Trang chủ
            </button>
            
            <div class="ls-auth-card">
                <div class="ls-auth-card__brand">
                    <div class="ls-auth-card__brand-name">LuxeStay</div>
                    <p class="ls-auth-card__brand-sub">Đăng nhập vào tài khoản của bạn</p>
                </div>
                
                <div id="login-error" class="ls-alert ls-alert--danger" style="display:none;"></div>
                
                <form id="login-form" onsubmit="return handleLogin(event)">
                    <div class="ls-form-group">
                        <label class="ls-form-label" for="username">Tên đăng nhập</label>
                        <input type="text" id="username" class="ls-form-input" placeholder="Nhập tên đăng nhập" required>
                    </div>
                    <div class="ls-form-group">
                        <label class="ls-form-label" for="password">Mật khẩu</label>
                        <input type="password" id="password" class="ls-form-input" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button type="submit" class="ls-btn ls-btn--primary" style="width:100%;margin-top:8px;">Đăng nhập</button>
                </form>
                
                <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--slate-100);font-size:0.875rem;color:var(--slate-500);">
                    Chưa có tài khoản? <a href="/register" style="font-weight:700;">Đăng ký ngay</a>
                </div>
            </div>
            
            <div class="ls-auth-card__decorative">
                <div style="width:100%;height:100%;background-size:cover;background-position:center;background-image:url('https://images.unsplash.com/photo-1590490360182-c33d57733427?w=400&q=80');"></div>
            </div>
        </div>
    </th:block>
</body>
</html>
