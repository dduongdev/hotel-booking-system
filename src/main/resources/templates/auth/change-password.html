<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="page-header">
            <h1>Change Password</h1>
            <p>Update your account password</p>
        </div>

        <div class="change-password-page">
            <div class="change-password-card">
                <div class="change-password-icon">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h2>Change Password</h2>
                <p class="change-password-subtitle">Enter your current password and choose a new one</p>

                <div id="change-password-error" class="alert alert-danger" style="display: none;"></div>
                <div id="change-password-success" class="alert alert-success" style="display: none;"></div>

                <form id="change-password-form" onsubmit="return handleChangePassword(event)">
                    <div class="form-group">
                        <label class="form-label" for="current-password">
                            <i class="bi bi-lock"></i> Current Password
                        </label>
                        <div class="password-input-wrapper">
                            <input type="password" id="current-password" class="form-control" placeholder="Enter your current password" required>
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('current-password', this)" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-password">
                            <i class="bi bi-key"></i> New Password
                        </label>
                        <div class="password-input-wrapper">
                            <input type="password" id="new-password" class="form-control" placeholder="Enter new password (8+ characters)" required minlength="8">
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('new-password', this)" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="password-strength">
                            <div class="password-strength-bar">
                                <div class="password-strength-fill" id="password-strength-fill"></div>
                            </div>
                            <span class="password-strength-text" id="password-strength-text"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirm-new-password">
                            <i class="bi bi-check-circle"></i> Confirm New Password
                        </label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirm-new-password" class="form-control" placeholder="Confirm your new password" required>
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm-new-password', this)" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-error" id="password-match-error" style="display: none;">Passwords do not match</div>
                    </div>

                    <div class="password-rules">
                        <div class="password-rule" id="rule-length">
                            <i class="bi bi-circle"></i> At least 8 characters
                        </div>
                        <div class="password-rule" id="rule-match">
                            <i class="bi bi-circle"></i> Passwords match
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="btn-change-password">
                        <i class="bi bi-arrow-repeat"></i> Change Password
                    </button>
                </form>

                <div class="change-password-footer">
                    <a href="/" class="btn btn-outline btn-sm">
                        <i class="bi bi-house-door"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
