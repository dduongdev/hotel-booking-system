<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                if (!TokenManager.isAuthenticated()) {
                    window.location.href = '/login';
                    return;
                }
                const user = TokenManager.getUser();
                if (!user || user.role !== 'MANAGER') {
                    window.location.href = '/';
                    return;
                }
                loadDashboardContent();
            });

            async function loadDashboardContent() {
                const mainContent = document.getElementById('admin-main-content');
                
                try {
                    // Load first branch for dashboard stats
                    let dashBranchId = null;
                    try {
                        const branchResult = await BranchAPI.getAll(0, 1);
                        const branches = branchResult.content || [];
                        if (branches.length > 0) {
                            dashBranchId = branches[0].id;
                        }
                    } catch (e) {
                        console.error('Failed to load branch', e);
                    }

                    let roomTypeResult = { content: [] };
                    let roomsResult = { totalElements: 0 };
                    let bookingsResult = { totalElements: 0 };

                    if (dashBranchId) {
                        [roomTypeResult, roomsResult, bookingsResult] = await Promise.all([
                            RoomTypeAPI.getAll(dashBranchId),
                            RoomAPI.getAll(dashBranchId, 0, 1),
                            BookingAPI.getAll(0, 1)
                        ]);
                    }
                    
                    const roomTypes = roomTypeResult.content || [];
                    const totalRoomTypes = roomTypes.length;
                    const totalRooms = roomsResult?.totalElements || 0;
                    const totalBookings = bookingsResult?.totalElements || 0;
                    
                    const user = TokenManager.getUser();
                    const displayName = user?.username || 'Admin';
                    
                    mainContent.innerHTML = `
                        <div class="ls-admin-topbar">
                            <div>
                                <div class="ls-admin-topbar__title">Bảng điều khiển</div>
                                <div class="ls-admin-topbar__subtitle">Xin chào, ${escapeHtml(displayName)}! Quản lý hệ thống LuxeStay.</div>
                            </div>
                            <div class="ls-admin-topbar__right">
                                <div class="flex items-center gap-3">
                                    <div style="width:40px;height:40px;border-radius:50%;background:var(--color-secondary-container);border:2px solid var(--color-secondary-container);overflow:hidden;display:flex;align-items:center;justify-content:center;">
                                        <span class="ls-icon" style="color:var(--color-on-secondary-container);font-size:20px;">person</span>
                                    </div>
                                    <div class="hidden sm:block text-left">
                                        <p class="text-xs font-bold text-slate-800">${escapeHtml(displayName)}</p>
                                        <p class="text-[10px] text-slate-400 font-medium">Quản trị viên</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Stats Grid -->
                        <div class="ls-stats-grid-4">
                            <div class="ls-stat-box">
                                <div class="ls-stat-box__icon ls-stat-box__icon--dark">
                                    <span class="ls-icon">book_online</span>
                                </div>
                                <div>
                                    <p class="ls-stat-box__label">Tổng lượt đặt</p>
                                    <h3 class="ls-stat-box__value">${totalBookings}</h3>
                                </div>
                            </div>
                            
                            <div class="ls-stat-box">
                                <div class="ls-stat-box__icon ls-stat-box__icon--dark">
                                    <span class="ls-icon">bed</span>
                                </div>
                                <div>
                                    <p class="ls-stat-box__label">Tổng phòng</p>
                                    <h3 class="ls-stat-box__value">${totalRooms}</h3>
                                </div>
                            </div>
                            
                            <div class="ls-stat-box">
                                <div class="ls-stat-box__icon ls-stat-box__icon--light">
                                    <span class="ls-icon">category</span>
                                </div>
                                <div>
                                    <p class="ls-stat-box__label">Danh mục phòng</p>
                                    <h3 class="ls-stat-box__value">${totalRoomTypes} loại</h3>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Action Cards -->
                        <div class="grid grid-cols-3" style="gap:24px;margin-top:24px;">
                            <div class="ls-feature-card" onclick="window.location.href='/admin/bookings'" style="cursor:pointer;padding:32px;text-align:center;display:flex;flex-direction:column;align-items:center;">
                                <div class="ls-feature-card__icon" style="width:56px;height:56px;border-radius:var(--radius-xl);margin:0 auto 16px;">
                                    <span class="ls-icon">calendar_today</span>
                                </div>
                                <h3 class="ls-feature-card__title" style="font-size:1rem;">Quản lý Đặt phòng</h3>
                                <p class="ls-feature-card__text" style="font-size:0.8125rem;">Xem và quản lý tất cả đặt phòng.</p>
                            </div>
                            <div class="ls-feature-card" onclick="window.location.href='/admin/rooms'" style="cursor:pointer;padding:32px;text-align:center;display:flex;flex-direction:column;align-items:center;">
                                <div class="ls-feature-card__icon" style="width:56px;height:56px;border-radius:var(--radius-xl);margin:0 auto 16px;">
                                    <span class="ls-icon">bed</span>
                                </div>
                                <h3 class="ls-feature-card__title" style="font-size:1rem;">Quản lý Phòng</h3>
                                <p class="ls-feature-card__text" style="font-size:0.8125rem;">Thêm, sửa, quản lý phòng.</p>
                            </div>
                            <div class="ls-feature-card" onclick="window.location.href='/admin/room-types'" style="cursor:pointer;padding:32px;text-align:center;display:flex;flex-direction:column;align-items:center;">
                                <div class="ls-feature-card__icon" style="width:56px;height:56px;border-radius:var(--radius-xl);margin:0 auto 16px;">
                                    <span class="ls-icon">category</span>
                                </div>
                                <h3 class="ls-feature-card__title" style="font-size:1rem;">Quản lý Loại Phòng</h3>
                                <p class="ls-feature-card__text" style="font-size:0.8125rem;">Cấu hình giá, sức chứa.</p>
                            </div>
                        </div>
                    `;
                } catch (error) {
                    mainContent.innerHTML = '<div class="ls-alert ls-alert--danger">Lỗi tải dữ liệu: ' + escapeHtml(error.message) + '</div>';
                }
            }
        </script>
    </th:block>
</body>
</html>
