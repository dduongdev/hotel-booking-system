<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                
                const checkIn = document.getElementById('avail-check-in');
                const checkOut = document.getElementById('avail-check-out');
                if (checkIn) checkIn.value = today.toISOString().split('T')[0];
                if (checkOut) checkOut.value = tomorrow.toISOString().split('T')[0];
            });

            async function searchAvailability() {
                const checkInInput = document.getElementById('avail-check-in') || document.getElementById('check-in');
                const checkOutInput = document.getElementById('avail-check-out') || document.getElementById('check-out');
                const resultsDiv = document.getElementById('availability-results');
                
                if (!checkInInput || !checkOutInput) {
                    ToastManager.show('Không tìm thấy trường ngày.', 'error');
                    return;
                }
                
                const checkIn = checkInInput.value;
                const checkOut = checkOutInput.value;
                
                if (!checkIn || !checkOut) {
                    ToastManager.show('Vui lòng chọn ngày nhận và trả phòng.', 'warning');
                    return;
                }
                
                if (checkIn >= checkOut) {
                    ToastManager.show('Ngày trả phòng phải sau ngày nhận phòng.', 'warning');
                    return;
                }
                
                resultsDiv.innerHTML = '<div class="ls-loading" style="grid-column:1/-1;"><div class="ls-spinner"></div><p>Đang tìm kiếm phòng trống...</p></div>';
                
                try {
                    const results = await RoomTypeAPI.getAvailability(checkIn, checkOut);
                    
                    if (!results || results.length === 0) {
                        resultsDiv.innerHTML = '<div class="ls-empty" style="grid-column:1/-1;"><div class="ls-empty__icon">🛏️</div><div class="ls-empty__title">Không có phòng trống</div><p class="ls-empty__text">Không có phòng trống cho ngày đã chọn. Vui lòng thử ngày khác.</p></div>';
                        return;
                    }
                    
                    resultsDiv.innerHTML = results.map(rt => `
                        <div class="ls-card" style="display:flex;flex-direction:column;">
                            <div style="height:200px;background:linear-gradient(135deg, var(--color-secondary-container), var(--color-secondary));display:flex;align-items:center;justify-content:center;font-size:3rem;">
                                🏨
                            </div>
                            <div class="ls-card__body" style="flex:1;display:flex;flex-direction:column;">
                                <h3 style="font-family:var(--font-display);font-weight:700;font-size:1.125rem;color:var(--slate-900);margin-bottom:8px;">${escapeHtml(rt.name)}</h3>
                                <p style="color:var(--slate-500);font-size:0.875rem;margin-bottom:16px;flex:1;">${escapeHtml(rt.description || 'Không có mô tả.')}</p>
                                <div class="flex gap-4 flex-wrap" style="margin-bottom:16px;">
                                    <span class="flex items-center gap-1.5 text-sm" style="color:var(--slate-700);">
                                        <span class="ls-icon ls-icon--sm">people</span> ${rt.capacity} khách
                                    </span>
                                    <span class="flex items-center gap-1.5 text-sm" style="color:var(--slate-700);">
                                        <span class="ls-icon ls-icon--sm">bed</span> ${rt.availableRoomCount} phòng trống
                                    </span>
                                </div>
                                <div>
                                    <span class="text-xs" style="color:var(--slate-400);">Giá chỉ từ</span>
                                    <div class="text-xl font-bold font-display" style="color:var(--color-secondary);">${formatCurrency(rt.pricePerNight)} <span style="font-size:0.75rem;font-weight:400;color:var(--slate-400);font-family:var(--font-sans);">/ đêm</span></div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } catch (error) {
                    resultsDiv.innerHTML = '<div class="ls-empty" style="grid-column:1/-1;"><div class="ls-empty__icon">⚠️</div><div class="ls-empty__title">Tìm kiếm thất bại</div><p class="ls-empty__text">' + escapeHtml(error.message) + '</p></div>';
                    ToastManager.show(error.message, 'error');
                }
            }
        </script>
    </th:block>
</body>
</html>
