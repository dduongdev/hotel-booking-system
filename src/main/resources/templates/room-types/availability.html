<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="page-header">
            <h1>Check Availability</h1>
            <p>Search for available room types by your preferred dates.</p>
        </div>
        
        <div class="search-bar">
            <div class="form-group">
                <label class="form-label" for="check-in">Check-in Date</label>
                <input type="date" id="check-in" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label" for="check-out">Check-out Date</label>
                <input type="date" id="check-out" class="form-control">
            </div>
            <button onclick="searchAvailability()" class="btn btn-primary">Search</button>
        </div>
        
        <div id="availability-results" class="grid-3">
            <div class="empty-state">
                <div class="icon">&#128269;</div>
                <h3>Search Availability</h3>
                <p>Enter your dates and click Search to find available rooms.</p>
            </div>
        </div>
    </th:block>
</body>
</html>
