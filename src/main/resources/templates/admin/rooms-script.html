<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            let adminRoomsPage = 0;
            const adminRoomsPageSize = 15;
            let adminRoomsSelectedBranchId = null;

            document.addEventListener('DOMContentLoaded', () => {
                if (!TokenManager.isAuthenticated()) {
                    window.location.href = '/login';
                    return;
                }
                const user = TokenManager.getUser();
                if (!user || user.role !== 'MANAGER') {
                    window.location.href = '/';
                    return;
                }
                loadAdminBranchesForRooms();
            });

            async function loadAdminBranchesForRooms() {
                try {
                    const result = await BranchAPI.getAll();
                    const branches = result.content || [];
                    const select = document.getElementById('admin-rooms-branch-select');
                    select.innerHTML = '<option value="">-- Chọn chi nhánh --</option>';
                    branches.forEach(b => {
                        const opt = document.createElement('option');
                        opt.value = b.id;
                        opt.textContent = `${b.address || 'Branch #' + b.id} - ${b.city || ''}`;
                        select.appendChild(opt);
                    });
                } catch (error) {
                    ToastManager.show('Lỗi tải danh sách chi nhánh.', 'error');
                }
            }

            function onAdminRoomsBranchChange() {
                const select = document.getElementById('admin-rooms-branch-select');
                adminRoomsSelectedBranchId = select.value ? parseInt(select.value) : null;
                if (adminRoomsSelectedBranchId) {
                    loadAdminRooms(0);
                } else {
                    document.getElementById('admin-rooms-container').innerHTML = '<div class="ls-empty"><div class="ls-empty__title">Chọn chi nhánh</div><p class="ls-empty__text">Vui lòng chọn một chi nhánh để xem danh sách phòng.</p></div>';
                }
            }

            async function loadAdminRooms(page = 0) {
                if (!adminRoomsSelectedBranchId) {
                    document.getElementById('admin-rooms-container').innerHTML = '<div class="ls-empty"><div class="ls-empty__title">Chọn chi nhánh</div><p class="ls-empty__text">Vui lòng chọn một chi nhánh để xem danh sách phòng.</p></div>';
                    return;
                }
                adminRoomsPage = page;
                const container = document.getElementById('admin-rooms-container');
                container.innerHTML = '<div class="ls-loading"><div class="ls-spinner"></div><p>Đang tải danh sách phòng...</p></div>';
                
                try {
                    const result = await RoomAPI.getAll(adminRoomsSelectedBranchId, page, adminRoomsPageSize);
                    const rooms = result.content || [];
                    const totalPages = result.totalPages || 0;
                    const roomTypes = (await RoomTypeAPI.getAll(adminRoomsSelectedBranchId)).content;
                    
                    if (rooms.length === 0) {
                        container.innerHTML = '<div class="ls-empty"><div class="ls-empty__title">Không có phòng</div><p class="ls-empty__text">Chưa có phòng nào được tạo.</p></div>';
                        return;
                    }
                    
                    let html = '<div class="ls-card"><div class="ls-table-container"><table class="ls-table"><thead><tr><th>ID</th><th>Tên phòng</th><th>Loại phòng</th><th>Giá/Đêm</th><th>Sức chứa</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>';
                    
                    rooms.forEach(room => {
                        const statusBadge = room.hidden ? '<span class="ls-badge ls-badge--hidden">Ẩn</span>' : '<span class="ls-badge ls-badge--visible">Hoạt động</span>';
                        html += `<tr>
                            <td><strong>${room.id}</strong></td>
                            <td>${escapeHtml(room.name)}</td>
                            <td>${escapeHtml(room.roomType?.name || 'N/A')}</td>
                            <td>${formatCurrency(room.roomType?.pricePerNight || 0)}</td>
                            <td>${room.roomType?.capacity || 0} khách</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button class="ls-btn ls-btn--outline ls-btn--sm edit-room-btn" 
                                    data-id="${room.id}" 
                                    data-name="${room.name.replace(/'/g, '&#39;')}" 
                                    data-type="${room.roomType?.id || 0}" 
                                    data-hidden="${room.hidden}">Sửa</button>
                            </td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table></div></div>';
                    
                    if (totalPages > 1) {
                        html += '<div class="ls-pagination">';
                        html += `<button onclick="loadAdminRooms(0)" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#171;</button>`;
                        html += `<button onclick="loadAdminRooms(${page - 1})" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#8249;</button>`;
                        html += `<span class="ls-pagination__info">Trang ${page + 1} / ${totalPages}</span>`;
                        html += `<button onclick="loadAdminRooms(${page + 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#8250;</button>`;
                        html += `<button onclick="loadAdminRooms(${totalPages - 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#187;</button>`;
                        html += '</div>';
                    }
                    
                    container.innerHTML = html;
                    
                    // Attach click handlers
                    container.querySelectorAll('.edit-room-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = parseInt(btn.dataset.id);
                            const name = btn.dataset.name;
                            const typeId = parseInt(btn.dataset.type);
                            const hidden = btn.dataset.hidden === 'true';
                            editRoom(id, name, typeId, hidden);
                        });
                    });
                } catch (error) {
                    container.innerHTML = '<div class="ls-empty"><div class="ls-empty__icon">⚠️</div><div class="ls-empty__title">Lỗi tải dữ liệu</div><p class="ls-empty__text">' + escapeHtml(error.message) + '</p></div>';
                }
            }

            async function populateRoomTypeSelect(selectedId) {
                if (!adminRoomsSelectedBranchId) return;
                try {
                    const roomTypes = (await RoomTypeAPI.getAll(adminRoomsSelectedBranchId)).content;
                    const select = document.getElementById('room-type-select');
                    select.innerHTML = '<option value="">-- Chọn loại phòng --</option>';
                    roomTypes.forEach(rt => {
                        const option = document.createElement('option');
                        option.value = rt.id;
                        option.textContent = `${rt.name} - ${formatCurrency(rt.pricePerNight)}/đêm`;
                        if (rt.id === selectedId) option.selected = true;
                        select.appendChild(option);
                    });
                } catch (error) {
                    ToastManager.show('Lỗi tải loại phòng.', 'error');
                }
            }

            function showAddRoomModal() {
                if (!adminRoomsSelectedBranchId) {
                    ToastManager.show('Vui lòng chọn chi nhánh trước.', 'warning');
                    return;
                }
                document.getElementById('room-modal-title').textContent = 'Thêm phòng';
                document.getElementById('room-id').value = '';
                document.getElementById('room-name').value = '';
                document.getElementById('room-hidden').checked = false;
                document.getElementById('room-hidden-group').style.display = 'none';
                document.getElementById('room-form-error').style.display = 'none';
                populateRoomTypeSelect(null);
                document.getElementById('room-modal').classList.add('ls-modal-overlay--active');
            }

            async function editRoom(id, name, roomTypeId, hidden) {
                document.getElementById('room-modal-title').textContent = 'Sửa phòng';
                document.getElementById('room-id').value = id;
                document.getElementById('room-name').value = name;
                document.getElementById('room-hidden').checked = hidden;
                document.getElementById('room-hidden-group').style.display = 'block';
                document.getElementById('room-form-error').style.display = 'none';
                await populateRoomTypeSelect(roomTypeId);
                document.getElementById('room-modal').classList.add('ls-modal-overlay--active');
            }

            function closeRoomModal() {
                document.getElementById('room-modal').classList.remove('ls-modal-overlay--active');
            }

            async function saveRoom(event) {
                event.preventDefault();
                const errorDiv = document.getElementById('room-form-error');
                errorDiv.style.display = 'none';
                
                const id = document.getElementById('room-id').value;
                const name = document.getElementById('room-name').value;
                const roomTypeId = parseInt(document.getElementById('room-type-select').value);
                const hidden = document.getElementById('room-hidden').checked;
                
                if (!name || !roomTypeId) {
                    errorDiv.textContent = 'Vui lòng điền đầy đủ thông tin.';
                    errorDiv.style.display = 'block';
                    return false;
                }
                
                try {
                    if (id) {
                        await RoomAPI.update(adminRoomsSelectedBranchId, parseInt(id), { name, roomTypeId, hidden });
                        ToastManager.show('Cập nhật phòng thành công.', 'success');
                    } else {
                        await RoomAPI.create(adminRoomsSelectedBranchId, { name, roomTypeId });
                        ToastManager.show('Thêm phòng thành công.', 'success');
                    }
                    closeRoomModal();
                    loadAdminRooms(adminRoomsPage);
                } catch (error) {
                    errorDiv.textContent = error.message || 'Thao tác thất bại.';
                    errorDiv.style.display = 'block';
                }
                return false;
            }
        </script>
    </th:block>
</body>
</html>
