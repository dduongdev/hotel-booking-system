<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            let adminRoomTypesPage = 0;
            const adminRoomTypesPageSize = 12;

            document.addEventListener('DOMContentLoaded', () => {
                if (!TokenManager.isAuthenticated()) {
                    window.location.href = '/login';
                    return;
                }
                const user = TokenManager.getUser();
                if (!user || user.role !== 'MANAGER') {
                    window.location.href = '/';
                    return;
                }
                loadAdminRoomTypes();
            });

            async function loadAdminRoomTypes(page = 0) {
                adminRoomTypesPage = page;
                const container = document.getElementById('admin-room-types-container');
                container.innerHTML = '<div class="ls-loading"><div class="ls-spinner"></div><p>Đang tải danh sách loại phòng...</p></div>';
                
                try {
                    const result = await RoomTypeAPI.getAll(page, adminRoomTypesPageSize);
                    const roomTypes = result.content || [];
                    const totalPages = result.totalPages || 0;
                    
                    if (roomTypes.length === 0) {
                        container.innerHTML = '<div class="ls-empty"><div class="ls-empty__title">Chưa có loại phòng</div><p class="ls-empty__text">Chưa có loại phòng nào được tạo.</p></div>';
                        return;
                    }
                    
                    let html = '<div class="grid" style="grid-template-columns:repeat(auto-fill, minmax(400px, 1fr));gap:24px;">';
                    
                    roomTypes.forEach(rt => {
                        const hiddenBadge = rt.hidden ? '<span class="ls-badge ls-badge--hidden" style="margin-top:8px;display:inline-block;">Đã ẩn</span>' : '<span class="ls-badge ls-badge--visible" style="margin-top:8px;display:inline-block;">Hiển thị</span>';
                        const imageHtml = rt.imageUrl ? `<img src="${escapeHtml(rt.imageUrl)}" alt="${escapeHtml(rt.name)}" style="width:100%;height:180px;object-fit:cover;border-radius:var(--radius-lg) var(--radius-lg) 0 0;">` : `<div style="width:100%;height:180px;background:var(--slate-100);border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;align-items:center;justify-content:center;">
                            <span class="ls-icon" style="font-size:48px;color:var(--slate-300);">image</span></div>`;
                        
                        html += `
                            <div class="ls-card">
                                ${imageHtml}
                                <div class="ls-card__header">
                                    <h3>${escapeHtml(rt.name)}</h3>
                                    <div class="flex gap-2">
                                        <button class="ls-btn ls-btn--outline ls-btn--sm edit-rt-btn" data-id="${rt.id}">Sửa</button>
                                        <button class="ls-btn ${rt.hidden ? 'ls-btn--success' : 'ls-btn--outline'} ls-btn--sm toggle-rt-btn" data-id="${rt.id}" data-hidden="${rt.hidden}">
                                            ${rt.hidden ? 'Hiện' : 'Ẩn'}
                                        </button>
                                    </div>
                                </div>
                                <div class="ls-card__body">
                                    <p style="color:var(--slate-600);margin-bottom:16px;font-size:0.875rem;">${escapeHtml(rt.description || 'Không có mô tả.')}</p>
                                    <div class="flex gap-4 flex-wrap" style="margin-bottom:8px;">
                                        <span class="flex items-center gap-1.5 text-sm" style="color:var(--slate-700);">
                                            <span class="ls-icon ls-icon--sm">people</span> ${rt.capacity} khách
                                        </span>
                                        <span class="flex items-center gap-1.5 text-sm font-bold" style="color:var(--color-secondary);">
                                            <span class="ls-icon ls-icon--sm">payments</span> ${formatCurrency(rt.pricePerNight)} / đêm
                                        </span>
                                    </div>
                                    ${hiddenBadge}
                                </div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                    
                    if (totalPages > 1) {
                        html += '<div class="ls-pagination">';
                        html += `<button onclick="loadAdminRoomTypes(0)" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#171;</button>`;
                        html += `<button onclick="loadAdminRoomTypes(${page - 1})" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#8249;</button>`;
                        html += `<span class="ls-pagination__info">Trang ${page + 1} / ${totalPages}</span>`;
                        html += `<button onclick="loadAdminRoomTypes(${page + 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#8250;</button>`;
                        html += `<button onclick="loadAdminRoomTypes(${totalPages - 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#187;</button>`;
                        html += '</div>';
                    }
                    
                    container.innerHTML = html;
                    
                    container.querySelectorAll('.edit-rt-btn').forEach(btn => {
                        btn.addEventListener('click', () => editRoomType(parseInt(btn.dataset.id)));
                    });
                    container.querySelectorAll('.toggle-rt-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = parseInt(btn.dataset.id);
                            const hidden = btn.dataset.hidden === 'true';
                            toggleRoomTypeHidden(id, !hidden);
                        });
                    });
                } catch (error) {
                    container.innerHTML = '<div class="ls-empty"><div class="ls-empty__icon">⚠️</div><div class="ls-empty__title">Lỗi tải dữ liệu</div><p class="ls-empty__text">' + escapeHtml(error.message) + '</p></div>';
                }
            }

            function showAddRoomTypeModal() {
                document.getElementById('room-type-modal-title').textContent = 'Thêm loại phòng';
                document.getElementById('room-type-id').value = '';
                document.getElementById('rt-name').value = '';
                document.getElementById('rt-description').value = '';
                document.getElementById('rt-capacity').value = '2';
                document.getElementById('rt-price').value = '';
                document.getElementById('rt-image').value = '';
                document.getElementById('rt-image-preview').style.display = 'none';
                document.getElementById('rt-hidden').checked = false;
                document.getElementById('rt-hidden-group').style.display = 'none';
                document.getElementById('room-type-form-error').style.display = 'none';
                document.getElementById('room-type-modal').classList.add('ls-modal-overlay--active');
            }

            async function editRoomType(id) {
                document.getElementById('room-type-modal-title').textContent = 'Sửa loại phòng';
                document.getElementById('room-type-form-error').style.display = 'none';
                
                try {
                    const roomTypes = (await RoomTypeAPI.getAll()).content;
                    const rt = roomTypes.find(r => r.id === id);
                    
                    if (!rt) {
                        ToastManager.show('Không tìm thấy loại phòng.', 'error');
                        return;
                    }
                    
                    document.getElementById('room-type-id').value = rt.id;
                    document.getElementById('rt-name').value = rt.name;
                    document.getElementById('rt-description').value = rt.description || '';
                    document.getElementById('rt-capacity').value = rt.capacity;
                    document.getElementById('rt-price').value = rt.pricePerNight;
                    document.getElementById('rt-image').value = '';
                    if (rt.imageUrl) {
                        document.getElementById('rt-image-preview').style.display = 'block';
                        document.getElementById('rt-image-preview-img').src = rt.imageUrl;
                    } else {
                        document.getElementById('rt-image-preview').style.display = 'none';
                    }
                    document.getElementById('rt-hidden').checked = rt.hidden || false;
                    document.getElementById('rt-hidden-group').style.display = 'block';
                    document.getElementById('room-type-modal').classList.add('ls-modal-overlay--active');
                } catch (error) {
                    ToastManager.show('Lỗi tải thông tin loại phòng.', 'error');
                }
            }

            function closeRoomTypeModal() {
                document.getElementById('room-type-modal').classList.remove('ls-modal-overlay--active');
            }

            async function saveRoomType(event) {
                event.preventDefault();
                const errorDiv = document.getElementById('room-type-form-error');
                errorDiv.style.display = 'none';
                
                const id = document.getElementById('room-type-id').value;
                const name = document.getElementById('rt-name').value;
                const description = document.getElementById('rt-description').value;
                const capacity = parseInt(document.getElementById('rt-capacity').value);
                const pricePerNight = parseFloat(document.getElementById('rt-price').value);
                
                if (!name || !capacity || !pricePerNight) {
                    errorDiv.textContent = 'Vui lòng điền đầy đủ thông tin.';
                    errorDiv.style.display = 'block';
                    return false;
                }
                
                const imageFile = document.getElementById('rt-image').files[0];
                
                try {
                    if (id) {
                        await RoomTypeAPI.updateWithImage(parseInt(id), { name, description, capacity, pricePerNight }, imageFile);
                        ToastManager.show('Cập nhật loại phòng thành công.', 'success');
                    } else {
                        await RoomTypeAPI.createWithImage({ name, description, capacity, pricePerNight }, imageFile);
                        ToastManager.show('Thêm loại phòng thành công.', 'success');
                    }
                    closeRoomTypeModal();
                    loadAdminRoomTypes(adminRoomTypesPage);
                } catch (error) {
                    errorDiv.textContent = error.message || 'Thao tác thất bại.';
                    errorDiv.style.display = 'block';
                }
                return false;
            }

            async function toggleRoomTypeHidden(id, hidden) {
                try {
                    await RoomTypeAPI.changeHiddenState(id, hidden);
                    ToastManager.show(`Loại phòng đã ${hidden ? 'ẩn' : 'hiện'}.`, 'success');
                    loadAdminRoomTypes(adminRoomTypesPage);
                } catch (error) {
                    ToastManager.show(error.message || 'Thao tác thất bại.', 'error');
                }
            }
        </script>
    </th:block>
</body>
</html>
