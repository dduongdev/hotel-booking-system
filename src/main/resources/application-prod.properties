# ===============================
# PROD PROFILE - MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://db:3306/hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

logging.level.root=INFO
logging.level.com.dduongdev.hotel=INFO
logging.level.org.springframework.security=WARN
# Storage
storage.type=minio
storage.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.minio.bucket=hotel-images
storage.minio.public-base-url=${MINIO_PUBLIC_URL:http://localhost:9000}

logging.level.org.hibernate.SQL=WARN

# Twilio SMS
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN}
sms.twilio.phone-number=${TWILIO_PHONE_NUMBER}