<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="page-header">
            <h1>Explore Rooms</h1>
            <p>Find the perfect room for your stay. Enter your dates to check availability.</p>
        </div>

        <div class="search-bar">
            <div class="form-group">
                <label class="form-label" for="check-in">Check-in Date</label>
                <input type="date" id="check-in" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label" for="check-out">Check-out Date</label>
                <input type="date" id="check-out" class="form-control">
            </div>
            <button onclick="searchAvailability()" class="btn btn-primary">Search</button>
        </div>

        <div id="room-types-grid" class="grid-3">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading room types...</p>
            </div>
        </div>
    </th:block>
</body>
</html>
