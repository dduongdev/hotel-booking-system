<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="script">
        <script>
            let myBookingsPage = 0;
            const myBookingsPageSize = 10;
            let allMyBookings = [];
            let filteredMyBookings = [];

            document.addEventListener('DOMContentLoaded', () => {
                if (!TokenManager.isAuthenticated()) {
                    window.location.href = '/login';
                    return;
                }
                loadMyBookings();
            });

            function filterMyBookings(searchTerm) {
                if (!searchTerm) {
                    filteredMyBookings = allMyBookings;
                } else {
                    const term = searchTerm.toLowerCase();
                    filteredMyBookings = allMyBookings.filter(b => 
                        b.id.toString().includes(term) || 
                        (b.roomTypeName && b.roomTypeName.toLowerCase().includes(term))
                    );
                }
                renderMyBookingsList();
            }

            async function loadMyBookings(page = 0) {
                myBookingsPage = page;
                const container = document.getElementById('my-bookings-container');
                container.innerHTML = '<div class="ls-loading"><div class="ls-spinner"></div><p>Đang tải dữ liệu đặt phòng...</p></div>';
                
                try {
                    const result = await BookingAPI.getMyBookings(page, myBookingsPageSize);
                    const bookings = result.content || [];
                    const totalPages = result.totalPages || 0;
                    
                    allMyBookings = bookings;
                    filteredMyBookings = bookings;
                    
                    renderMyBookingsList();
                    
                    // Pagination
                    if (totalPages > 1) {
                        const pagination = document.createElement('div');
                        pagination.className = 'ls-pagination';
                        pagination.innerHTML = `
                            <button onclick="loadMyBookings(0)" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#171;</button>
                            <button onclick="loadMyBookings(${page - 1})" class="ls-pagination__btn" ${page === 0 ? 'disabled' : ''}>&#8249;</button>
                            <span class="ls-pagination__info">Trang ${page + 1} / ${totalPages}</span>
                            <button onclick="loadMyBookings(${page + 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#8250;</button>
                            <button onclick="loadMyBookings(${totalPages - 1})" class="ls-pagination__btn" ${page >= totalPages - 1 ? 'disabled' : ''}>&#187;</button>
                        `;
                        container.appendChild(pagination);
                    }
                } catch (error) {
                    container.innerHTML = '<div class="ls-empty"><div class="ls-empty__icon">⚠️</div><div class="ls-empty__title">Lỗi tải dữ liệu</div><p class="ls-empty__text">' + escapeHtml(error.message) + '</p></div>';
                }
            }

            function renderMyBookingsList() {
                const container = document.getElementById('my-bookings-container');
                
                if (filteredMyBookings.length === 0) {
                    container.innerHTML = `
                        <div class="ls-empty">
                            <div class="ls-empty__title">Chưa có đặt phòng</div>
                            <p class="ls-empty__text">Bạn chưa có đặt phòng nào. Hãy đặt ngay tại trang chủ!</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '<div class="ls-table-container"><table class="ls-table"><thead><tr><th>Mã đặt</th><th>Loại phòng</th><th>Phòng</th><th>Nhận phòng</th><th>Trả phòng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>';
                
                filteredMyBookings.forEach(booking => {
                    const statusClass = getStatusBadgeClass(booking.status);
                    const statusText = getStatusText(booking.status);
                    const canCancel = booking.status === 'CONFIRMED';
                    const roomDisplay = booking.roomName ? escapeHtml(booking.roomName) : '<em style="color:var(--slate-400);font-style:italic;">Chưa gán</em>';
                    const roomTypeDisplay = booking.roomTypeName ? escapeHtml(booking.roomTypeName) : 'N/A';
                    
                    html += `<tr>
                        <td><strong>#${booking.id}</strong></td>
                        <td>${roomTypeDisplay}</td>
                        <td>${roomDisplay}</td>
                        <td>${formatDateTime(booking.checkIn)}</td>
                        <td>${formatDateTime(booking.checkOut)}</td>
                        <td><span class="${statusClass}">${statusText}</span></td>
                        <td>
                            ${canCancel ? `<button onclick="cancelMyBooking(${booking.id})" class="ls-btn ls-btn--danger ls-btn--sm">Hủy</button>` : '<span class="ls-badge ls-badge--secondary">-</span>'}
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table></div>';
                
                container.innerHTML = html;
            }

            async function cancelMyBooking(bookingId) {
                if (!confirm('Bạn có chắc muốn hủy đặt phòng #' + bookingId + '?')) return;
                
                try {
                    await BookingAPI.cancelMyBooking(bookingId);
                    ToastManager.show('Đã hủy đặt phòng thành công.', 'success');
                    loadMyBookings(myBookingsPage);
                } catch (error) {
                    ToastManager.show(error.message || 'Hủy đặt phòng thất bại.', 'error');
                }
            }
        </script>
    </th:block>
</body>
</html>
