<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="ls-admin-layout ls-admin-wrapper">
            <!-- Sidebar -->
            <aside class="ls-sidebar">
                <div class="ls-sidebar__header">
                    <div class="ls-sidebar__logo">
                        <span class="ls-icon" style="font-variation-settings:'FILL' 1;">hotel_class</span>
                    </div>
                    <div>
                        <div class="ls-sidebar__title">LuxeStay Admin</div>
                        <div class="ls-sidebar__subtitle">Hệ thống quản lý chuỗi</div>
                    </div>
                </div>
                
                <nav class="ls-sidebar__nav" id="admin-sidebar-nav">
                    <a href="/admin/dashboard" class="ls-sidebar__nav-item ls-sidebar__nav-item--active" data-section="dashboard">
                        <span class="ls-icon ls-icon--sm">dashboard</span> Bảng điều khiển
                    </a>
                    <a href="/admin/bookings" class="ls-sidebar__nav-item" data-section="bookings">
                        <span class="ls-icon ls-icon--sm">calendar_today</span> Lịch đặt phòng
                    </a>
                    <a href="/admin/rooms" class="ls-sidebar__nav-item" data-section="rooms">
                        <span class="ls-icon ls-icon--sm">bed</span> Quản lý phòng
                    </a>
                    <a href="/admin/room-types" class="ls-sidebar__nav-item" data-section="room-types">
                        <span class="ls-icon ls-icon--sm">category</span> Loại phòng
                    </a>

                </nav>
                
                <div class="ls-sidebar__footer">
                    <a href="/admin/rooms" class="ls-sidebar__add-btn">
                        <span class="ls-icon ls-icon--sm">add_circle</span>
                        Thêm phòng mới
                    </a>
                    <div style="margin-top:12px;">
                        <a href="#" onclick="event.preventDefault(); logoutUser();" style="width:100%;padding:12px;display:flex;align-items:center;gap:12px;border-radius:var(--radius-lg);font-size:0.75rem;font-weight:700;color:var(--danger);text-decoration:none;transition:var(--transition);" onmouseover="this.style.background='var(--danger-bg)'" onmouseout="this.style.background='transparent'">
                            <span class="ls-icon ls-icon--sm">logout</span> Đăng xuất Admin
                        </a>
                    </div>
                </div>
            </aside>
            
            <!-- Main Content -->
            <main class="ls-main-content" id="admin-main-content">
                <div class="ls-loading">
                    <div class="ls-spinner"></div>
                    <p>Đang tải dữ liệu...</p>
                </div>
            </main>
        </div>
    </th:block>
</body>
</html>
