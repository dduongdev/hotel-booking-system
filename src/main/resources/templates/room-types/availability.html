<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head></head>
<body>
    <th:block th:fragment="content">
        <div class="ls-container">
            <div class="page-header" style="margin-bottom:32px;">
                <h1 style="font-family:var(--font-display);font-size:1.75rem;font-weight:800;color:var(--slate-900);">Kiểm tra Phòng Trống</h1>
                <p style="color:var(--slate-500);font-size:0.9375rem;">Tìm kiếm phòng trống theo ngày mong muốn của bạn.</p>
            </div>
            
            <!-- Branch Selector + Search Bar -->
            <div class="ls-filter-bar" style="flex-wrap:wrap;">
                <div class="ls-form-group" style="flex:1;min-width:200px;margin-bottom:0;">
                    <label class="ls-form-label" for="avail-branch-select">Chi nhánh</label>
                    <select id="avail-branch-select" class="ls-form-input" onchange="onAvailBranchChange()">
                        <option value="">-- Chọn chi nhánh --</option>
                    </select>
                </div>
                <div class="ls-form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                    <label class="ls-form-label" for="avail-check-in">Ngày nhận phòng</label>
                    <input type="date" id="avail-check-in" class="ls-form-input">
                </div>
                <div class="ls-form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                    <label class="ls-form-label" for="avail-check-out">Ngày trả phòng</label>
                    <input type="date" id="avail-check-out" class="ls-form-input">
                </div>
                <button onclick="searchAvailability()" class="ls-btn ls-btn--secondary" style="flex-shrink:0;margin-top:20px;">
                    <span class="ls-icon ls-icon--sm">search</span>
                    Tìm kiếm
                </button>
            </div>
            
            <!-- Results -->
            <div id="availability-results" class="grid" style="grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));gap:24px;">
                <div class="ls-empty" style="grid-column:1/-1;">
                    <div class="ls-empty__icon">🔍</div>
                    <div class="ls-empty__title">Tìm kiếm phòng trống</div>
                    <p class="ls-empty__text">Nhập ngày và nhấn Tìm kiếm để xem phòng trống.</p>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
